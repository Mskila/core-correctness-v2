[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers
timeout = 120
timeout_method = thread
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
    ignore:for .* copying from a non-meta parameter.*:UserWarning
    ignore:unclosed file <_io.FileIO.*:ResourceWarning
    ignore:Exception ignored in.*<_io.FileIO.*:pytest.PytestUnraisableExceptionWarning
markers =
    core: core-correctness specification and characterization gates
    deterministic: repeatability and resume-equivalence tests
    integration: cross-module deterministic integration tests
    slow: long-running tests excluded from the default quick loop
    performance: non-thresholded benchmark and performance smoke tests
